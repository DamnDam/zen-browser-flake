name: Check and build all packages

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check flake
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@v14
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check --all-systems

  build:
    name: Build for ${{ matrix.system }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Build package
        run: nix build ".#packages.${{ matrix.system }}.default"
