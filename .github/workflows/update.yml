name: Update to latest version and flake inputs

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    name: Update flake inputs and browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@v14

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for and perform updates
        run: |
          nix run .#update
